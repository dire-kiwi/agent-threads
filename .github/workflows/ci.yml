# Builds and tests the TypeScript, Go and Rust packages, the shim and the example apps, and checks
# that the code generated from spec/schema is up to date (make check-gen), on each pull request and
# push to main.
# It needs no secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  PNPM_VERSION: 10.34.9

jobs:
  generated:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm install -g pnpm@$PNPM_VERSION

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.mod

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust

      - name: pnpm install
        working-directory: ts
        run: pnpm install --frozen-lockfile

      - run: make check-gen

  spec:
    name: Fixtures and their tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: make test-spec

  ts:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm install -g pnpm@$PNPM_VERSION

      # For agent-threads-shim, which the Node backend's tests run.
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: shim

      - name: pnpm install
        working-directory: ts
        run: pnpm install --frozen-lockfile

      - run: make test-ts

  example:
    name: Example apps (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm install -g pnpm@$PNPM_VERSION

      # For agent-threads-shim, which the restart test runs.
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            shim
            examples/chat-rust

      # For chat-go's server, which the same smoke tests run against too.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: examples/chat-go/go.mod
          cache-dependency-path: |
            go/go.sum
            examples/chat-go/go.sum

      - name: pnpm install
        working-directory: ts
        run: pnpm install --frozen-lockfile

      - run: make shim

      # chat-rust's and chat-go's servers, which the same smoke tests run against below.
      - name: Build chat-rust
        working-directory: examples/chat-rust
        run: cargo build --locked

      - name: Build chat-go
        working-directory: examples/chat-go
        run: go build -o chat-go .

      - name: Build the packages and the app
        working-directory: ts
        run: pnpm build

      - name: Playwright's Chromium
        working-directory: examples/chat-node
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke tests, against the fake CLI
        working-directory: examples/chat-node
        run: pnpm exec playwright test

      - name: The same smoke tests, against chat-rust's server
        working-directory: examples/chat-node
        env:
          CHAT_E2E_SERVER: ${{ github.workspace }}/examples/chat-rust/target/debug/chat-rust
        run: pnpm exec playwright test

      - name: The same smoke tests, against chat-go's server
        working-directory: examples/chat-node
        env:
          CHAT_E2E_SERVER: ${{ github.workspace }}/examples/chat-go/chat-go
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            examples/chat-node/playwright-report
            examples/chat-node/test-results
          retention-days: 7

  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.sum
            examples/chat-go/go.sum

      # For the fake CLI, which the fixtures and the example's tests replay sessions with.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # For agent-threads-shim, which the fixtures and the restart tests run under.
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: shim

      - run: make test-go

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # For the fake CLI that replays the fixtures, and the comparator (spec/tools).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable

      # The Rust backend's tests build and run agent-threads-shim too.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            rust
            shim
            examples/chat-rust

      - run: make test-rust

      - run: make test-chat-rust

  # The crate builds on Windows, where the shim doesn't run and direct() is the spawner.
  rust-windows:
    name: Rust (Windows build)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust

      - name: cargo check
        working-directory: rust
        run: cargo check --locked -p agent-threads --all-targets

  shim:
    name: Shim
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: shim

      - run: make test-shim
